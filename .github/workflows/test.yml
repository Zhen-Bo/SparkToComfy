name: Test

# Shared by CI and release so both use the same verification gate.
on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-python: true

      - run: uv sync --locked

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      # Build before pytest: app.main mounts SPA routes only when frontend/dist exists.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

      # The e2e marker needs a real ComfyUI on 8188; pyproject already deselects it.
      - run: uv run pytest -q
