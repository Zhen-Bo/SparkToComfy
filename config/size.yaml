# Injected into every size control at load time.
# Landscape swaps width/height; do not add separate landscape presets.
presets:
    square:
        label: "1:1"
        icon: square
        standard:
            width: 1536
            height: 1536
        highres:
            width: 2048
            height: 2048
    poster:
        label: "2:3"
        icon: poster
        standard:
            width: 1024
            height: 1536
        highres:
            width: 1280
            height: 1920
    photo:
        label: "3:4"
        icon: photo
        standard:
            width: 1152
            height: 1536
        highres:
            width: 1440
            height: 1920
    wallpaper:
        label: "9:16"
        icon: wallpaper
        standard:
            width: 864
            height: 1536
        highres:
            width: 1080
            height: 1920
