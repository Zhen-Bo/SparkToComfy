# Copy and register this example to declare another workflow:
#   config/workflow.yaml         the registry, which gives the workflow its id and points at the two files below
#   config/parameter/<id>.yaml   this file
#   config/workflow/<name>.json  the graph, exported from ComfyUI with "Export (API)"
#
# Control bindings:
#   node     a string key in the exported JSON; quote numeric-looking IDs.
#   target   a literal key in the node's "inputs", not a path (e.g. "resize_type.scale").
#
# Reloaded every 30 seconds; failed loads keep the previous catalog and log the error.
#
# Replace model/LoRA/sampler names with those installed on your ComfyUI instance:
#   curl -s localhost:8188/object_info/UNETLoader           | jq '..|.unet_name?//empty|.[0]'
#   curl -s localhost:8188/object_info/LoraLoaderModelOnly  | jq '..|.lora_name?//empty|.[0]'
#   curl -s localhost:8188/object_info/KSampler             | jq '..|.sampler_name?//empty|.[0]'

# Fixed graph inputs, not exposed to the operator.
hidden:
    clip:
        node: "20735:6198"
        target: clip_name
        value: qwen3vl_4b_fp8_scaled.safetensors
    clip_type:
        node: "20735:6198"
        target: type
        value: krea2
    trigger_message:
        node: "20738"
        target: orinalMessage
        value: ""
    trigger_words:
        node: "20738"
        target: toggle_trigger_words
        value: { __value__: [] }
    filename:
        node: "20745"
        target: filename_prefix
        value: API/%date:yyyy-MM-dd-hh-mm-ss%-%seed%-%model%

# User controls are validated server-side; undeclared parameter names are rejected.
basic:
    # Options accept `key: Label` or a table; disabled options are also rejected server-side.
    model:
        node: "20735:6196"
        target: unet_name
        type: dropdown
        options:
            krea2\krea2Turbo_v10_fp8.safetensors:
                label: Krea2 Turbo FP8
            krea2\krea2Turbo_v10_bf16.safetensors:
                label: Krea2 Turbo
                disabled: true
        default: krea2\krea2Turbo_v10_fp8.safetensors

    # max_length is enforced server-side, not just in the textarea.
    quality:
        node: "20739"
        target: positive
        type: multiline
        max_length: 500
        default: "masterpiece, best quality, very aesthetic, ultra-detailed"
    positive:
        node: "20740"
        target: positive
        type: multiline
        max_length: 3000
        default: ""
    negative:
        node: "20741"
        target: negative
        type: multiline
        max_length: 500
        default: ""

    # Presets come from config/size.yaml; the node needs custom_width and custom_height inputs.
    size:
        node: "20755"
        type: size

advanced:
    # value_kind/min/max are enforced server-side; display/step are frontend hints.
    steps:
        node: "20742"
        target: steps
        type: input
        value_kind: int
        display: slider
        min: 1
        max: 50
        step: 1
        default: 8
    cfg:
        node: "20742"
        target: cfg
        type: input
        value_kind: float
        display: slider
        min: 0
        max: 7
        step: 0.1
        default: 1.0

    # seed — an integer, or -1 for "roll a new one on every run".
    seed:
        node: "20742"
        target: seed
        type: seed
        default: -1
    sampler:
        node: "20742"
        target: sampler_name
        type: dropdown
        options:
            euler: Euler
            euler_ancestral: Euler a
            dpmpp_2m: DPM++ 2M
            dpmpp_2m_sde: DPM++ 2M SDE
            dpmpp_3m_sde: DPM++ 3M SDE
        default: euler_ancestral
    scheduler:
        node: "20742"
        target: scheduler
        type: dropdown
        options:
            normal: Normal
            simple: Simple
            beta: Beta
        default: beta

    # At scale 1, bypass the upscaler by wiring its consumer to the original image.
    # Any control type may declare a bypass block.
    upscale:
        node: "20744"
        target: resize_type.scale
        type: input
        value_kind: float
        display: slider
        min: 1
        max: 2
        step: 0.1
        default: 1
        bypass:
            at: 1
            rewire:
                node: "20753"
                input: anything
                to:
                    node: "20743"
                    slot: 0

    # Requires ComfyUI-Lora-Manager's Lora Loader (LoraManager): the backend writes
    # structured `loras` inputs and clears `text`; cover art uses the same add-on.
    # Replace these example options with file names reported by your LoRA Manager,
    # without the .safetensors suffix. Omit this control if the graph uses no LoRAs.
    lora:
        node: "20737"
        type: lora
        strength:
            min: 0
            max: 2
            step: 0.05
            default: 1
        options:
            R9FG018QZ03G8N8C4JKMMKCJA0: KMJ style lora
            Ps_Special_Merge_for_Krea2-v1: Ps Special Merge Style
            Ps_gpt2-style_v3-krea2: Ps GPT-image-2 style
            Krea2_TextFusion_Refusal_Reduction: TextFusion Refusal-Reduction
