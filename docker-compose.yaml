services:
  backend:
    image: ghcr.io/zhen-bo/sparktocomfy:latest
    container_name: comfypanel
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SERVER__HOST: 0.0.0.0
      SERVER__PORT: "8000"
      SERVER__DATABASE: /app/data/comfypanel.db
      COMFYUI__URL: http://host.docker.internal:8188
      # Match console timestamps to the operator's timezone.
      TZ: Asia/Taipei
      # Trust bridge proxies' X-Forwarded-For so per-IP limits do not share one gateway IP.
      # Never use `*`: callers could forge the forwarded address.
      FORWARDED_ALLOW_IPS: "172.16.0.0/12"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/app/config:ro
      - comfypanel-data:/app/data

volumes:
  comfypanel-data:
