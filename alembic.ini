[alembic]
script_location = alembic
file_template = %%(year)d-%%(month).2d-%%(day).2d_%%(slug)s
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is not set here. alembic/env.py takes it from config/app.toml, or
# the caller supplies it through config.attributes["url"] (tests use a temp file).
