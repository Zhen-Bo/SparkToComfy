[project]
name = "comfypanel-backend"
version = "0.3.0"
description = "Relay backend between the web frontend and a ComfyUI instance"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pyyaml",
    "websockets>=17.0.1",
    "limits>=5.8.0",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.13",
    "httpx>=0.27",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
    "pyright>=1.1.410",
]

[tool.ruff]
# Markdown quotes ComfyUI source verbatim, so it must never be reformatted.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC", "RUF100"]
ignore = ["ASYNC109"]  # a test helper taking a timeout argument is fine

[tool.ruff.lint.isort]
# The repo root holds an alembic/ migration directory; keep isort from treating the alembic package as first-party.
known-third-party = ["alembic"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["app", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["e2e: needs a real ComfyUI running on 127.0.0.1:8188 and really generates images"]
addopts = "-m 'not e2e'"
